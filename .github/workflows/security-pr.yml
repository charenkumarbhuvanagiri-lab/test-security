name: Security PR Checks

on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  dependency-review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v5
